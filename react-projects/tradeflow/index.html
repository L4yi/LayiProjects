<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>TradeFlow</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('tradeflow_theme');
          if (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            t = 'dark';
          }
          if (t === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}

        // Automatic self-healing for stale dynamic module imports
        function handleChunkError(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          if (
            msg.indexOf('Failed to fetch dynamically imported module') !== -1 ||
            msg.indexOf('Importing a module script failed') !== -1 ||
            msg.indexOf('error loading dynamically imported module') !== -1
          ) {
            var key = 'tf_auto_reload_ts';
            var last = parseInt(sessionStorage.getItem(key) || '0', 10);
            var now = Date.now();
            if (now - last > 10000) {
              sessionStorage.setItem(key, String(now));
              window.location.reload();
            }
          }
        }
        window.addEventListener('error', handleChunkError, true);
        window.addEventListener('vite:preloadError', function() {
          var key = 'tf_auto_reload_ts';
          var last = parseInt(sessionStorage.getItem(key) || '0', 10);
          var now = Date.now();
          if (now - last > 10000) {
            sessionStorage.setItem(key, String(now));
            window.location.reload();
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
