<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="ROBOTS" content="ALL" />
    <meta name="Engine" content="all" />
    <meta name="distribution" content="global" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta property="og:type" content="Website" />

    <link href="all-images/icon-images/icon.png" rel="shortcut icon" type="image/png" />
    <link href="styles/icons-1.11.3/font/bootstrap-icons.css" type="text/css" rel="stylesheet" />
    <link href="styles/contants.css" type="text/css" rel="stylesheet" />
    <link href="styles/main.css" type="text/css" rel="stylesheet" />
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <title>TradeFlow | Sign Up</title>
</head>

<body>
    <section class="auth-section">
        <div class="auth-background">
            <div class="overlay-bg">
                <div class="form-container">
                    <div class="form-content">
                        <div class="inner-form">
                            <a href="index.html" class="solara-logo">
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                                </svg>
                                TradeFlow
                            </a>

                            <div class="form-header">
                                <h2>Sign Up</h2>
                                <p>Already have an account? <a href="sign-in.html" class="link">Sign In</a></p>
                            </div>

                            <div class="input-container">
                                <div class="input-wrapper">
                                    <label for="fullName">Full Name <span>*</span></label>
                                    <input type="text" class="text-field" id="fullName"
                                        placeholder="Enter Your Full Name" autocomplete="name" required />
                                </div>

                                <div class="input-wrapper">
                                    <label for="emailAddress">Email Address <span>*</span></label>
                                    <input type="email" class="text-field" id="emailAddress"
                                        placeholder="example@gmail.com" autocomplete="email" required />
                                </div>

                                <div class="input-wrapper">
                                    <label for="phoneNumber">Phone Number <span>*</span></label>
                                    <input type="tel" class="text-field" id="phoneNumber"
                                        placeholder="Enter Your Phone Number" autocomplete="tel" required />
                                </div>

                                <div class="input-wrapper">
                                    <label for="password">PassWord <span>*</span></label>
                                    <div class="password-input-group">
                                        <input type="password" class="text-field" id="password"
                                            placeholder="Create a strong password" autocomplete="new-password" required />
                                        <button type="button" class="password-toggle-btn"
                                            onclick="togglePasswordVisibility('password', 'signUpEyeIcon')"
                                            title="Toggle Password Visibility">
                                            <i class="bi bi-eye" id="signUpEyeIcon"></i>
                                        </button>
                                    </div>
                                </div>

                                <button class="btn-primary" type="button" id="submitBtnId" title="Sign Up" onclick="signUpHandle()">
                                    Sign Up
                                </button>
                            </div>

                            <div class="divider">
                                <span>OR</span>
                            </div>

                            <div class="social-btn-container">
                                <button type="button" class="social-btn">
                                    <svg viewBox="0 0 24 24">
                                        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                                        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
                                        <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
                                        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                                    </svg>
                                    Continue with Google
                                </button>
                                <button type="button" class="social-btn">
                                    <svg viewBox="0 0 24 24" fill="#1877F2">
                                        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                                    </svg>
                                    Continue with Facebook
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="form-content showcase-content">
                        <div class="support-top-link">
                            <a href="mailto:support@TradeFlow.com" class="support-btn">
                                <i class="bi bi-headset"></i>
                                Support
                            </a>
                        </div>

                        <div class="showcase-card-wrapper">
                            <img src="all-images/body-images/solara-card-feature.png" alt="Solara Card Feature" class="showcase-feature-img" />
                        </div>

                        <div class="showcase-bottom-text">
                            <h3>Introducing new features</h3>
                            <p>Analyzing previous trends ensures that businesses always make the right decision. And as the scale of the decision and it's impact magnifies...</p>
                            <div class="showcase-carousel-nav">
                                <span class="carousel-arrow">&lt;</span>
                                <span class="carousel-dot"></span>
                                <span class="carousel-dot active"></span>
                                <span class="carousel-dot"></span>
                                <span class="carousel-arrow">&gt;</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
