<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="ROBOTS" content="ALL" />
    <meta name="Engine" content="all" />
    <meta name="distribution" content="global" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta property="og:type" content="Website" />

    <link href="all-images/icon-images/icon.png" rel="shortcut icon" type="image-png" />
    <link href="styles/icons-1.11.3/font/bootstrap-icons.css" type="text/css" rel="stylesheet" />
    <link href="styles/contants.css" type="text/css" rel="stylesheet" />
    <link href="styles/main.css" type="text/css" rel="stylesheet" />
    <title>Login - BelajarYuk.</title>
</head>

<body>
    <div class="page-wrapper">
        <div class="container">


            <div class="left-box">
                <div class="left-header">
                    <div class="logo">BelajarYuk.</div>
                    <div class="subtitle">Let's Learning Something New Today</div>
                </div>


                <div class="left-graphics">

                    <img src="all-images/body-images/image.png" alt="Phones Mockup" class="phones-display-image" />
                </div>


                <div class="left-footer">
                    <div class="badge-container">

                        <div class="store-badge google-play">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 466 511.98"
                                class="store-svg badge-svg-play">
                                <path fill="#4285F4"
                                    d="M1.39 41.86C0 46.04 0 51.63 0 57.2v397.64c0 5.57 0 9.76 1.4 15.34l216.27-214.86L1.39 41.86z" />
                                <path fill="#34A853"
                                    d="M199.42 273.45 329.27 145.1 87.9 8.37C79.53 2.79 68.36 0 57.2 0 30.7 0 6.98 18.14 1.4 41.86l198.02 231.59z" />
                                <path fill="#FBBC04"
                                    d="m433.91 205.1-104.65-60-111.61 110.22 113.01 108.83 104.64-58.6c18.14-9.77 30.7-29.3 30.7-50.23-1.4-20.93-13.95-40.46-32.09-50.22z" />
                                <path fill="#EA4335"
                                    d="M199.9 237.8 1.4 470.17c7.22 24.57 30.16 41.81 55.8 41.81 11.16 0 20.93-2.79 29.3-8.37l244.16-139.46L199.9 237.8z" />
                            </svg>
                            <div class="store-text">
                                <span class="store-sub">GET IT ON</span>
                                <span class="store-main">Google Play</span>
                            </div>
                        </div>

                        <div class="store-badge app-store">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"
                                class="store-svg badge-svg-apple">
                                <path fill="#ffffff"
                                    d="M11.182.008C11.148-.03 9.923.023 8.857 1.18c-1.066 1.156-.902 2.482-.878 2.516s1.52.087 2.475-1.258.762-2.391.728-2.43m3.314 11.733c-.048-.096-2.325-1.234-2.113-3.422s1.675-2.789 1.698-2.854-.597-.79-1.254-1.157a3.7 3.7 0 0 0-1.563-.434c-.108-.003-.483-.095-1.254.116-.508.139-1.653.589-1.968.607-.316.018-1.256-.522-2.267-.665-.647-.125-1.333.131-1.824.328-.49.196-1.422.754-2.074 2.237-.652 1.482-.311 3.83-.067 4.56s.625 1.924 1.273 2.796c.576.984 1.34 1.667 1.659 1.899s1.219.386 1.843.067c.502-.308 1.408-.485 1.766-.472.357.013 1.061.154 1.782.539.571.197 1.111.115 1.652-.105.541-.221 1.324-1.059 2.238-2.758q.52-1.185.473-1.282" />
                            </svg>
                            <div class="store-text">
                                <span class="store-sub">Download on the</span>
                                <span class="store-main">App Store</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>


            <div class="right-box">
                <div class="right-header">
                    <h2 class="right-heading">Log in to BelajarYuk.</h2>
                    <p class="welcome-text">Welcome back! login with your data that you entered during registration</p>
                </div>

                <div class="social-login-container">
                    <button class="social-btn google-btn">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" class="google-svg">
                            <path fill="#4285F4"
                                d="M22.5 12.25c0-.74-.07-1.45-.2-2.13H12v4.03h5.88c-.26 1.41-1.07 2.6-2.28 3.41v2.73h3.53c2.07-1.91 3.27-4.73 3.27-8.04z" />
                            <path fill="#EA4335"
                                d="M12 23c2.95 0 5.43-.98 7.23-2.65l-3.53-2.73c-.98.66-2.23 1.06-3.7 1.06-2.84 0-5.25-1.92-6.11-4.49H2.23v2.84C4.1 20.25 7.74 23 12 23z" />
                            <path fill="#FBBC05"
                                d="M5.89 14.19c-.22-.66-.35-1.37-.35-2.19s.13-1.53.35-2.19V6.97H2.23c-.76 1.52-1.2 3.23-1.2 5.03s.44 3.51 1.2 5.03l3.66-2.84z" />
                            <path fill="#34A853"
                                d="M12 5.37c1.58 0 3.01.54 4.13 1.6l3.1-3.1C17.3 1.93 14.95 1 12 1 7.74 1 4.1 3.75 2.23 6.97l3.66 2.84c.86-2.57 3.27-4.44 6.11-4.44z" />
                        </svg>
                        <span>Login with Google</span>
                    </button>
                    <button class="social-btn facebook-btn">
                        <i class="bi bi-facebook facebook-icon"></i>
                        <span>Login with Facebook</span>
                    </button>
                </div>

                <div class="divider-container">
                    <div class="divider-line"></div>
                    <div class="divider-text">or</div>
                    <div class="divider-line"></div>
                </div>


                <form class="auth-form">

                    <div class="input-box">
                        <div class="input-icon-container">
                            <i class="bi bi-envelope"></i>
                        </div>
                        <div class="input-content">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="rifqinaufal@mail.com"   />
                        </div>
                    </div>


                    <div class="input-box">
                        <div class="input-icon-container">
                            <i class="bi bi-lock"></i>
                        </div>
                        <div class="input-content">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" placeholder="password123"   />
                        </div>

                    </div>



                    <div class="form-options">
                        <div class="remember-me-container">
                            <input type="checkbox" id="remember-me" class="checkbox-input" />
                            <label for="remember-me" class="checkbox-label">Remember me</label>
                        </div>
                        <a href="forgot-password.html" class="forgot-link">Forgot your password?</a>
                    </div>


                    <button type="submit" class="auth-btn">LOGIN</button>
                </form>


                <div class="register-container">
                    <span class="register-text">Don't have an account? <a href="sign-up.html"
                            class="register-link">Register</a></span>
                </div>
            </div>

        </div>
    </div>
</body>

</html>
