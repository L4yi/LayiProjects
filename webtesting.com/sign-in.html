<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http: //www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="ROBOTS" content="ALL" />
    <meta name="Engine" content="all" />
    <meta name="distribution" content="global" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta property="og:type" content="Website" />

    <link href="all-images/icon-images/icon.png" rel="shortcut icon" type="image-png" />
    <link href="styles/icons-1.11.3/font/bootstrap-icons.css" type="text/css" rel="stylesheet" />
    <link href="styles/contants.css" type="text/css" rel="stylesheet" />
    <link href="styles/main.css" type="text/css" rel="stylesheet" />
    <title>NIITITCORE | Sign In</title>
</head>

<body>
    <section class="auth-section">
        <div class="auth-background">
            <div class="overlay-bg">
                <div class="form-container">

                    <div class="form-content">

                        <div class="inner-form">
                            <div class="top-container">
                                <h2>Sign In</h2>
                                <div class="icon-container">
                                    <div class="icon">
                                        <i class="bi bi-facebook">
                                        </i>
                                    </div>
                                    <div class="icon">
                                        <i class="bi bi-twitter">
                                        </i>
                                    </div>
                                </div>
                            </div>
                            <div class="input-container">
                                <div class="input-wrapper">
                                    <label>Email Address <span>*</span> </label>
                                    <input type="text" class="text-field" id="emailAddress"
                                        placeholder="Enter Your Email Address" />
                                </div>
                                <div class="input-wrapper">
                                    <label>Password <span>*</span> </label>
                                    <input type="password" class="text-field" id="password"
                                        placeholder="Enter Your Password" />
                                </div>
                                <a href="">
                                    <button class="btn " title="Sign In">Sign In</button>
                                </a>


                            </div>
                            <div class="bottom-container">
                                <div class="bottom-text">
                                    <label>
                                        <input type="checkbox" class="checkbox" />
                                        <span>Remember Me</span>
                                    </label>
                                </div>
                                <div class="bottom-text">
                                    <label>
                                       <a href="forgot-password.html">
                                        <span class="forgot-password">Forgot Password?</span>
                                       </a>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="form-content text-content">
                        <div class="text-wrapper">
                            <div class="logo-container">
                                <img src="all-images/icon-images/niit-logo.png" alt="Niit Logo">
                            </div>
                            <div class="title">
                                <h1>Welcome to Student Portal</h1>
                                <p>Don't have an account? </p>
                            </div>
                            <a href="sign-up.html">
                                <button class="btn">Sign Up</button>
                            </a>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
