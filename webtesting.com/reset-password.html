<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http: //www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="ROBOTS" content="ALL" />
    <meta name="Engine" content="all" />
    <meta name="distribution" content="global" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta property="og:type" content="Website" />

    <link href="all-images/icon-images/icon.png" rel="shortcut icon" type="image-png" />
    <link href="styles/icons-1.11.3/font/bootstrap-icons.css" type="text/css" rel="stylesheet" />
    <link href="styles/contants.css" type="text/css" rel="stylesheet" />
    <link href="styles/main.css" type="text/css" rel="stylesheet" />
    <title>NIITITCORE | Forgot Password</title>
</head>

<body>
    <section class="auth-section">
        <div class="auth-background">
            <div class="overlay-bg">
                <div class="form-container">

                    <div class="form-content">

                        <div class="inner-form">
                            <div class="top-container">
                                <h2>Forgot Password</h2>

                            </div>
                            <div class="input-container">
                                <div class="input-wrapper">
                                    <div class="alert-success">
                                    <span class="icon">👋</span>
                                    <p>
                                        <strong>L4yi,</strong> an OTP has been sent to your
                                        <strong>email address</strong> to reset your password.
                                    </p>
                                </div>
                                    <label>OTP <span>*</span> </label>
                                    <input type="text" class="text-field" id="otp" placeholder="Enter Your OTP" />
                                </div>

                                
                                <div class="input-wrapper">
                                    <label> New Password <span>*</span> </label>
                                    <input type="text" class="text-field" id="password"
                                        placeholder="Enter Your New Password" />
                                </div>
                                
                                    <div class="alert-success alert-danger">
                                      
                                    <p>
                                     <i> Atleast 8 characters, 1 uppercase letter, 1 lowercase letter, 1 number and 1 special character.
                                    </p></i> 
                                  
                                </div>
                                <div class="input-wrapper">
                                    <label>Confirm New Password <span>*</span> </label>
                                    <input type="text" class="text-field" id="confirmPassword"
                                        placeholder="Confirm Your New Password" />
                                </div>

                                <a href="">
                                    <button class="btn " title=" Submit">Submit Your New Password</button>
                                </a>


                            </div>

                        </div>
                    </div>
                    <div class="form-content text-content">
                        <div class="text-wrapper">
                            <div class="logo-container">
                                <img src="all-images/icon-images/niit-logo.png" alt="Niit Logo">
                            </div>
                            <div class="title">
                                <h1>Welcome to NIIT Student Portal</h1>
                                <p>Sign In to access your account</p>
                            </div>
                            <a href="sign-in.html">
                                <button class="btn">Sign In</button>
                            </a>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
